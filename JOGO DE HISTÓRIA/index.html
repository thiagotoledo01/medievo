<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabuleiro da Idade Média</title>
<link rel="stylesheet" href="css/style.css"></head><body>
<button id="menu-btn" type="button" onclick="gaveta(true)" title="Menu">☰</button>
<div id="dback" onclick="gaveta(false)"></div>
<aside id="drawer">
 <h3>⚔️ Menu</h3>
 <button id="n-jogo" class="on" onclick="aba('jogo')">🎮 Jogo</button>
 <button id="n-resumo" onclick="aba('resumo')">📖 Resumo</button>
 <button id="n-tut" onclick="aba('tut')">❓ Tutorial</button>
 <hr>
 <button id="n-rolar" onclick="gaveta(false);rolarVirtual()">🎲 Rolar dado virtual</button>
 <button id="mute" onclick="toggleSom()">🔊 Som: ligado</button>
 <button onclick="tela();gaveta(false)">🖥️ Tela cheia</button>
 <hr>
 <button class="red" onclick="gaveta(false);if(confirm('Encerrar a partida?'))reiniciar()">🗑️ Encerrar partida</button>
</aside>
<div class="ov" id="fsov" style="display:flex;z-index:400"><div class="mbox" style="text-align:center;max-width:520px">
 <h1 style="color:#f4d03f">🖥️ Melhor em tela cheia</h1>
 <p style="font-size:20px;margin:14px 0 20px">Para uma melhor experiência, recomendamos jogar em <b>tela cheia</b>.</p>
 <button class="btn" onclick="tela();$('fsov').style.display='none'">Ativar tela cheia</button>
 <button class="btn gray" onclick="$('fsov').style.display='none'">Continuar assim</button>
</div></div>

<!-- ABA JOGO -->
<div class="tab on" id="t-jogo">
 <div id="setup" class="card">
  <h1>⚔️ Tabuleiro da Idade Média</h1>
  <p style="margin-bottom:16px">Quantos times vão jogar? (1 a 10)</p>
  <input type="number" id="nt" min="1" max="10" value="2"><br><br>
  <button class="btn" onclick="irSelecao()">Escolher personagens ➜</button>
  <p style="margin-top:14px"><button class="btn gray" id="btn-cont" style="display:none" onclick="continuar()">▶ Continuar partida salva</button></p>
  <p style="margin-top:14px;font-size:14px;color:#bdc3c7">Dica: leia o Resumo antes de jogar!</p>
 </div>

 <div id="sel" style="display:none">
  <div class="stage"><div class="car">
   <button class="arr" type="button" onclick="mudaP(-1)">‹</button>
   <div><img id="s-img" alt=""><div class="pf" id="s-pf">🛡️</div></div>
   <button class="arr" type="button" onclick="mudaP(1)">›</button>
  </div></div>
  <div class="info">
   <div class="lbl" id="s-time"></div>
   <input type="text" id="s-nome" maxlength="22" placeholder="Nome do time">
   <h2 id="s-pers"></h2>
   <div class="resumo" id="s-res"></div>
   <div class="thumbs" id="s-thumbs"></div>
   <div class="taken" id="s-taken"></div>
   <button class="btn" id="s-ok" onclick="confirmaP()">✔ Escolher este personagem</button>
  </div>
 </div>

 <div id="jogo">
  <div id="board"><div id="hud"></div><div id="pins"></div></div>
  <div id="dock">🎲 <input type="number" id="dado" min="1" max="6" value="1"><button class="btn" id="b-mover" onclick="jogarDado(+$('dado').value)">Mover</button></div>
  <div id="score" style="display:none"></div>
 </div>
</div>

<!-- ABA RESUMO (slides) -->
<div class="tab" id="t-resumo"><div class="sl" id="sl-resumo"></div></div>

<!-- ABA TUTORIAL (slides) -->
<div class="tab" id="t-tut"><div class="sl" id="sl-tut"></div></div>

<div class="ov" id="qov"><div class="mbox">
 <div class="mh"><span id="qteam"></span><div id="timer">30</div></div>
 <span class="tema" id="qtema"></span>
 <div id="qtxt"></div><div id="qopts"></div><div id="fb"></div>
 <div id="qact" style="display:none;gap:10px;flex-wrap:wrap">
  <button class="btn" onclick="fechaPergunta()">Continuar ➜</button>
  <button class="btn gray" id="b-rev" onclick="verResumo()">📖 Ver no resumo</button>
 </div>
</div></div>

<div class="ov" id="pov"><div class="mbox" style="text-align:center">
 <h1 style="color:#f1c40f">🏆 Pódio Final 🏆</h1><div class="pod" id="pod"></div>
 <button class="btn" onclick="reiniciar()">Jogar de novo</button>
</div></div>
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/fullscreen.js"></script>
<script src="js/game.js"></script></body></html>
